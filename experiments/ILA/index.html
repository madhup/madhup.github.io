
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS v0.1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const LIFE_OS_DATA = {
            domains: [
                { id: 'psyche', title: 'Psyche', subtitle: 'The Subjective Self', color: 'text-fuchsia-400', currency: 'Attention & Cognitive Bandwidth', threat: '"Noise" (Algorithmic hijacking, ego)', nature: 'Sentient', scale: 'Individual' },
                { id: 'assets', title: 'Assets', subtitle: 'The Objective Resources', color: 'text-amber-400', currency: 'Time & Capital', threat: 'Physical decay & inflation', nature: 'Structural', scale: 'Individual' },
                { id: 'kinship', title: 'Kinship', subtitle: 'The Relational Web', color: 'text-rose-400', currency: 'Emotional Bandwidth & Presence', threat: 'Relational drift & resentment', nature: 'Sentient', scale: 'Collective' },
                { id: 'ecosystem', title: 'Ecosystem', subtitle: 'The Context', color: 'text-sky-400', currency: 'Optionality & Leverage', threat: 'Friction & Black Swans', nature: 'Structural', scale: 'Collective' }
            ],
            vectors: [
                { id: 'maintenance', title: 'Maintenance', subtitle: 'Survival', tempo: 'Ambient, automated', success: 'Zero Failure', color: 'bg-blue-500/10 text-blue-400 border-blue-500/30', hoverLine: 'bg-blue-500', motive: 'Utility', trajectory: 'Stabilizing' },
                { id: 'optimization', title: 'Optimization', subtitle: 'Growth', tempo: 'Sprinted, deep', success: 'Asymmetric Yield', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30', hoverLine: 'bg-emerald-500', motive: 'Utility', trajectory: 'Expanding' },
                { id: 'immersion', title: 'Immersion', subtitle: 'Presence', tempo: 'Slow, timeless', success: 'Frictionless Flow', color: 'bg-purple-500/10 text-purple-400 border-purple-500/30', hoverLine: 'bg-purple-500', motive: 'Meaning', trajectory: 'Stabilizing' },
                { id: 'contribution', title: 'Contribution', subtitle: 'Impact', tempo: 'Deliberate, sacrificial', success: 'Silent Enablement', color: 'bg-orange-500/10 text-orange-400 border-orange-500/30', hoverLine: 'bg-orange-500', motive: 'Meaning', trajectory: 'Expanding' }
            ],
            zones: {
                // ROW 1: MAINTENANCE
                'maintenance-psyche': {
                    name: 'Sanity', archetype: 'The Monk',
                    mandate: 'To build an impenetrable "Fortress of Peace" that protects cognitive hardware and filters all software inputs.',
                    maxim: '"Defend the gates of your attention; everything else is downstream."',
                    examples: ['8 hours of non-negotiable sleep', 'Deleting algorithmic feeds', 'Walking in silence', 'Executing "default no" templates for coffee chats'],
                    nonExamples: ['Tracking sleep so obsessively it causes anxiety', 'Doomscrolling "educational" content', 'Saying yes out of guilt'],
                    success: 'A quiet, unhurried mind. Waking up naturally. A subjective feeling of moving "Slowly" through a chaotic world.',
                    failure: 'Chronic overwhelm, brain fog, reactive decision-making, and ego-depletion by 2:00 PM.'
                },
                'maintenance-assets': {
                    name: 'Integrity', archetype: 'The Warden',
                    mandate: 'To construct an unbreakable "Fortress of Preservation" that prevents the decay of biological, physical, and digital hardware.',
                    maxim: '"Entropy never sleeps; therefore, maintenance must be systematized."',
                    examples: ['Annual DEXA scans and blood panels', 'Replacing the roof before it leaks', 'Utilizing hardware YubiKeys', 'Executing Zone 2 cardio'],
                    nonExamples: ['Trying biohacking fads without baseline testing', 'Waiting for the car transmission to blow before servicing it'],
                    success: 'Uninterrupted compounding. The physical and biological infrastructure is completely invisible because it never breaks down.',
                    failure: 'A catastrophic, entirely preventable failure (heart attack, hacked primary bank account, collapsed infrastructure) that zeroes out progress.'
                },
                'maintenance-kinship': {
                    name: 'Cohesion', archetype: 'The Administrator',
                    mandate: 'To systematize the "Relational Infrastructure" so the core family survives entropy and the broader network never drifts.',
                    maxim: '"Automate the logistics so you can humanize the connection."',
                    examples: ['A 15-minute Sunday calendar sync with a spouse', 'Setting an automated CRM reminder to voice-note a college friend every 45 days'],
                    nonExamples: ['Arguing over chores on a Friday night date', 'Relying on pure memory to maintain a 30-person network', 'Letting logistics ruin romance'],
                    success: 'A frictionless household. Friends feel remembered and valued without you experiencing cognitive overload or guilt.',
                    failure: 'Bitter resentment over unequal domestic labor. Losing touch with lifelong friends simply due to "just being busy."'
                },
                'maintenance-ecosystem': {
                    name: 'Compliance', archetype: 'The Ghost',
                    mandate: 'Building "The Admin Shield" to completely outsource bureaucracy and adhere to societal/legal requirements invisibly.',
                    maxim: '"Pay the premium to make the bureaucracy invisible."',
                    examples: ['Auto-paying all estimated taxes via a retained CPA', 'Using a registered agent for LLCs', 'Automating insurance renewals on a high-limit card'],
                    nonExamples: ['Spending a Sunday trying to decipher tax code to save $50', 'Missing a registration deadline and getting fined'],
                    success: 'Total invisibility of the state and bureaucracy in your daily life. Zero missed deadlines, zero cognitive cycles spent on red tape.',
                    failure: 'Legal audits, massive fines, blocked accounts, or spending dozens of hours fighting broken administrative systems.'
                },
                
                // ROW 2: OPTIMIZE
                'optimization-psyche': {
                    name: 'Insight', archetype: 'The Scholar',
                    mandate: 'To build a rigorous "Competence Engine" that upgrades internal algorithms and ensures elite, high-leverage decision-making.',
                    maxim: '"Seek fundamental truth, not societal validation."',
                    examples: ['Reading an SEC 10-K filing directly', 'Maintaining a decision journal', 'Spending 2 hours trying to disprove your own core investment thesis'],
                    nonExamples: ['Reading journalistic summaries of studies', 'Memorizing trivia to sound smart', 'Adopting a guru\'s framework without testing it'],
                    success: 'High conviction, low anxiety decision-making. The ability to rapidly update Bayesian priors when presented with new data without ego-defense.',
                    failure: 'Ideological capture. Parroting consensus talking points. Making massive life choices based on cognitive biases.'
                },
                'optimization-assets': {
                    name: 'Capitalization', archetype: 'The Hidden Tycoon',
                    mandate: 'To operate an "Omni-Asset Engine" that systematically increases leverage, equity, and yield while aggressively decoupling income from labor.',
                    maxim: '"Optimize exclusively for optionality, never for status."',
                    examples: ['Automating 75% of income into global index funds', 'Taking a role compensated in equity over a higher base salary', 'Building low-touch software'],
                    nonExamples: ['Day-trading options', 'Working 80 hours a week for a fixed salary', 'Buying a depreciating luxury asset with debt'],
                    success: 'A continuously rising "Decoupling Ratio" (wealth generated independently of hours worked). Absolute financial optionality.',
                    failure: 'Golden handcuffs. High income but zero time. Being trapped in a high-stress lifestyle just to fund expensive liabilities.'
                },
                'optimization-kinship': {
                    name: 'Integration', archetype: 'The Anchor',
                    mandate: 'The "Deepening Protocol." Actively upgrading vulnerability and vision-alignment exclusively with the Tier 1 Inner Circle.',
                    maxim: '"Relational depth requires the courage to surface hidden friction."',
                    examples: ['A deeply vulnerable conversation about life fears during an unplugged retreat', 'Drafting a family constitution to align on core values'],
                    nonExamples: ['"How was your day?" surface-level chat', 'Avoiding conflict to "keep the peace"', 'Trying to optimize a casual acquaintance'],
                    success: 'Absolute trust, deep vision alignment, and the complete absence of hidden resentments with the core inner circle.',
                    failure: '"Roommate Mode." Living parallel lives under the same roof. Emotional isolation despite being surrounded by people.'
                },
                'optimization-ecosystem': {
                    name: 'Architecture', archetype: 'The Master Architect',
                    mandate: 'Out-architecting chaos and decision fatigue by pre-solving the temporal future (Time) and configuring physical reality (Space).',
                    maxim: '"Pre-solve the future so you can dominate the present."',
                    examples: ['Moving to a city with top-tier schools 3 years before having kids', 'Using the 50-Year Almanac to pre-allocate funds for aging parents'],
                    nonExamples: ['Realizing your parents need assisted living after a fall', 'Moving to a toxic, high-stress environment for a slight pay bump'],
                    success: 'Life feels strangely easy because the spatial and temporal environment was mathematically designed to support your goals years in advance.',
                    failure: 'Constant firefighting. Being a victim of circumstance, forced into reactive, desperate choices by external shocks.'
                },

                // ROW 3: IMMERSION
                'immersion-psyche': {
                    name: 'Reverie', archetype: 'The Tinkerer',
                    mandate: 'The "Intellectual Lab." Engaging the mind purely for the intrinsic experience of flow, unstructured curiosity, and "Hard Fun."',
                    maxim: '"Joy and curiosity are their own absolute justifications."',
                    examples: ['Reading a massive sci-fi novel', 'Learning calculus for fun', 'Tearing apart an engine to see how it works with zero intention of fixing it'],
                    nonExamples: ['Reading a business book to "level up"', 'Learning to code strictly to build a startup', 'Optimizing a hobby for social media clout'],
                    success: 'Loss of self-consciousness and time perception. Pure flow state and narrative absorption.',
                    failure: 'Boredom. Treating learning like a "chore" or constantly calculating the ROI of a weekend hobby.'
                },
                'immersion-assets': {
                    name: 'Sensation', archetype: 'The Epicurean',
                    mandate: 'The curation of a frictionless "Aesthetic Estate" and the pursuit of high-definition, somatic worldly experiences.',
                    maxim: '"Curate for intrinsic delight, never for extrinsic display."',
                    examples: ['Dialing in the perfect pour-over coffee', 'Sitting in a perfectly ergonomic chair', 'An unplugged trip to Spain focusing purely on architecture'],
                    nonExamples: ['Buying a Rolex to signal wealth', 'Staying in a 5-star hotel but answering emails in the lobby', 'Tracking heart rate while surfing'],
                    success: 'High-definition presence in the physical world. Absolute sensory delight in the immediate environment.',
                    failure: 'Numbness to luxury. Surrounding oneself with expensive things but feeling nothing. Clutter and physical friction.'
                },
                'immersion-kinship': {
                    name: 'Communion', archetype: 'The Companion',
                    mandate: '"Unstructured Joy." Agenda-less shared presence and pure play.',
                    maxim: '"The highest form of human connection is agenda-less presence."',
                    examples: ['Laughing on the couch over a terrible movie', 'A casual backyard BBQ', 'Playing a co-op video game. Zero agenda, zero optimization'],
                    nonExamples: ['"Networking" at a party', 'Discussing the mortgage or career anxieties during date night', 'Checking phones at the dinner table'],
                    success: 'Pure, joyful presence. The feeling of "home" and total belonging with other human beings.',
                    failure: 'Every interaction feels transactional. The inability to relax around others. Exhaustion from performing socially.'
                },
                'immersion-ecosystem': {
                    name: 'Exploration', archetype: 'The Flâneur',
                    mandate: 'Unstructured discovery. Observing complex systems, wandering the physical/digital world, and cultivating serendipity.',
                    maxim: '"Rigid optimization is the enemy of discovery."',
                    examples: ['Getting off at a random train stop in a foreign country and wandering', 'Walking into a weird local museum with zero context'],
                    nonExamples: ['Following a heavily optimized TripAdvisor top 10 list', 'Vlogging the exploration', 'Trying to "network" while getting lost'],
                    success: 'A continuous sense of wonder and serendipity. Expanding the surface area for lucky, unexpected encounters.',
                    failure: 'A highly rigid, overly-optimized life where every minute is accounted for and novelty is entirely dead.'
                },

                // ROW 4: CONTRIBUTION
                'contribution-psyche': {
                    name: 'Counsel', archetype: 'The Grey Eminence',
                    mandate: 'The "Whisper Network." Exporting high-leverage wisdom privately to alter the trajectories of a select few.',
                    maxim: '"Provide the map, but make them swing the sword."',
                    examples: ['A private 2-hour coffee helping a protégé map a career pivot', 'Sharing an atomic, highly detailed essay exclusively with 3 friends'],
                    nonExamples: ['Tweeting a thread of "advice" to 10,000 strangers', 'Doing the actual work for the mentee', 'Seeking public gratitude'],
                    success: 'The mentee executes a non-linear leap in their life using your framework, and you feel zero need to take public credit.',
                    failure: '"Guru-syndrome." Building an audience of dependents who require you to make their micro-decisions.'
                },
                'contribution-assets': {
                    name: 'Provision', archetype: 'The Angel Investor',
                    mandate: 'Acting as the "Dream Funder." The unilateral deployment of financial surplus to unlock the latent potential or solve the crises of the tribe.',
                    maxim: '"Surplus is a tool to quietly unlock the latent potential of the tribe."',
                    examples: ['Paying off a parent\'s medical bill anonymously', 'Funding a friend\'s creative project with zero expectation of equity or return'],
                    nonExamples: ['Loaning money to family (creates weird power dynamics)', 'Holding a gift over someone\'s head', 'Giving capital you can\'t afford to lose'],
                    success: 'The tribe thrives. Friction is removed from loved ones\' lives silently and permanently.',
                    failure: 'Creating financial dependency, breeding resentment through unspoken strings attached, or bankrupting oneself.'
                },
                'contribution-kinship': {
                    name: 'Stewardship', archetype: 'The Shield',
                    mandate: 'The Safety Net. Direct, immediate capacity to unilaterally absorb the tribe\'s physical or emotional burdens during a crisis.',
                    maxim: '"Bear the load unilaterally, without keeping score."',
                    examples: ['Taking FMLA leave to care for a dying parent', 'Stepping in to mediate a severe conflict between two best friends', 'Being the 3 AM emergency call'],
                    nonExamples: ['Keeping a mental spreadsheet of "favors owed"', 'Complaining about the burden to the person you are helping'],
                    success: 'The tribe knows, fundamentally, they will not fall because you are there to catch them. Absolute reliability in a Black Swan event.',
                    failure: 'Martyrdom. Destroying your own life/sanity to save someone else, resulting in two casualties instead of one.'
                },
                'contribution-ecosystem': {
                    name: 'Legacy', archetype: 'The Ancestor',
                    mandate: '"The Long Arch." Multi-generational impact, systemic stewardship, and planting trees whose shade you will never sit in.',
                    maxim: '"Plant trees under whose shade you do not expect to sit."',
                    examples: ['Writing a core set of values for descendants', 'Open-sourcing a valuable software tool you built', 'Setting up an ironclad generational trust'],
                    nonExamples: ['Trying to get a building named after yourself', 'Hoarding wealth indefinitely', 'Forcing descendants to follow your exact career path'],
                    success: 'The systems, wealth, and wisdom you built continue to protect and empower the ecosystem long after your physical timeline ends.',
                    failure: '"Shirtsleeves to shirtsleeves in three generations." The empire crumbles the moment you die because it relied solely on your ego and direct control.'
                }
            }
        };

        const Icons = {
            Close: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            ),
            Check: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-400 mt-1 shrink-0"><polyline points="20 6 9 17 4 12"></polyline></svg>
            ),
            Cross: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-400 mt-1 shrink-0"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            ),
            Info: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="inline-block ml-1 opacity-60"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            )
        };

        const ZoneModal = ({ zone, vectorInfo, domainInfo, onClose }) => {
            if (!zone) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in" onClick={onClose}>
                    <div 
                        className="relative w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh] sm:max-h-[90vh] animate-slide-up"
                        onClick={e => e.stopPropagation()}
                    >
                        {/* Header */}
                        <div className={`p-4 sm:p-6 border-b border-slate-800 ${vectorInfo.color.split(' ')[0]}`}>
                            <div className="flex justify-between items-start">
                                <div className="pr-2">
                                    <div className="flex items-center space-x-2 text-[9px] sm:text-[10px] uppercase tracking-[0.2em] font-bold mb-2 opacity-80 flex-wrap gap-y-1">
                                        <span>{domainInfo.title} Domain</span>
                                        <span className="hidden sm:inline">•</span>
                                        <span>{vectorInfo.title} Vector</span>
                                    </div>
                                    <div className="flex items-baseline space-x-2 sm:space-x-3 mb-2 flex-wrap">
                                        <h2 className="text-xl sm:text-2xl md:text-3xl font-extrabold text-white leading-tight">{zone.name}</h2>
                                        <span className="text-[9px] sm:text-[10px] uppercase tracking-[0.2em] font-bold px-2 py-1 rounded bg-slate-950/40 text-white border border-white/20 mt-1 sm:mt-0">
                                            {zone.archetype}
                                        </span>
                                    </div>
                                    <div className="mt-2 sm:mt-3 text-white/90 italic font-medium border-l-2 border-white/30 pl-3 leading-relaxed text-sm sm:text-base">
                                        {zone.maxim}
                                    </div>
                                </div>
                                <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full transition-colors text-white shrink-0 -mr-2 sm:mr-0">
                                    <Icons.Close />
                                </button>
                            </div>
                        </div>

                        {/* Body - Scrollable */}
                        <div className="p-4 sm:p-6 overflow-y-auto custom-scrollbar flex-1 space-y-5 sm:space-y-6">
                            <div>
                                <h3 className="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-bold mb-2">Core Mandate</h3>
                                <p className="text-slate-200 text-base sm:text-lg leading-relaxed font-medium">{zone.mandate}</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                                {/* Examples */}
                                <div className="bg-slate-800/40 rounded-xl p-4 sm:p-5 border border-slate-700/50">
                                    <h3 className="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-bold mb-3 sm:mb-4">Examples (Do This)</h3>
                                    <ul className="space-y-2 sm:space-y-3">
                                        {zone.examples.map((ex, i) => (
                                            <li key={i} className="flex items-start text-slate-300 text-xs sm:text-sm leading-relaxed">
                                                <Icons.Check />
                                                <span className="ml-2 sm:ml-3">{ex}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                {/* Non-Examples */}
                                <div className="bg-slate-800/40 rounded-xl p-4 sm:p-5 border border-slate-700/50">
                                    <h3 className="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-bold mb-3 sm:mb-4">Anti-Patterns (Not This)</h3>
                                    <ul className="space-y-2 sm:space-y-3">
                                        {zone.nonExamples.map((ex, i) => (
                                            <li key={i} className="flex items-start text-slate-400 text-xs sm:text-sm leading-relaxed">
                                                <Icons.Cross />
                                                <span className="ml-2 sm:ml-3 italic">{ex}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                            {/* Outcomes */}
                            <div className="grid grid-cols-1 gap-3 pt-1 sm:pt-2">
                                <div className="p-4 sm:p-5 rounded-xl bg-emerald-950/20 border border-emerald-900/40">
                                    <h3 className="text-[10px] uppercase tracking-[0.2em] text-emerald-500 font-bold mb-2">Success State</h3>
                                    <p className="text-emerald-100/90 text-xs sm:text-sm leading-relaxed font-medium">{zone.success}</p>
                                </div>
                                <div className="p-4 sm:p-5 rounded-xl bg-red-950/20 border border-red-900/40">
                                    <h3 className="text-[10px] uppercase tracking-[0.2em] text-red-400 font-bold mb-2">Failure State</h3>
                                    <p className="text-red-100/90 text-xs sm:text-sm leading-relaxed font-medium">{zone.failure}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedId, setSelectedId] = React.useState(null);
            const [isSimpleMode, setIsSimpleMode] = React.useState(true);

            const handleEscape = React.useCallback((e) => {
                if (e.key === 'Escape') setSelectedId(null);
            }, []);

            React.useEffect(() => {
                document.addEventListener('keydown', handleEscape);
                return () => document.removeEventListener('keydown', handleEscape);
            }, [handleEscape]);

            const selectedZone = selectedId ? LIFE_OS_DATA.zones[selectedId] : null;
            const selectedVector = selectedId ? LIFE_OS_DATA.vectors.find(v => v.id === selectedId.split('-')[0]) : null;
            const selectedDomain = selectedId ? LIFE_OS_DATA.domains.find(d => d.id === selectedId.split('-')[1]) : null;

            return (
                <div className="min-h-screen p-4 md:p-8 lg:p-12 flex flex-col items-center selection:bg-blue-500/30 selection:text-white">
                    
                    {/* Header - Responsive text sizing */}
                    <div className="max-w-4xl w-full mb-8 lg:mb-10 text-center space-y-4 lg:space-y-5 mt-2 lg:mt-4">
                        <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight text-white drop-shadow-sm flex items-center justify-center flex-wrap gap-2">
                            <span>Life<span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">OS</span></span>
                            <span className="text-lg md:text-2xl font-bold text-slate-500 border border-slate-700 bg-slate-800/50 px-3 py-1 rounded-full">v0.1</span>
                        </h1>
                        <p className="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base lg:text-lg leading-relaxed mt-4 font-medium px-2">
                            A rigorous, MECE ontological and teleological model mapping the variables of human existence.
                        </p>
                    </div>

                    {/* Simple Mode Toggle - Hidden on mobile as it relies on desktop grid layout */}
                    <div className="hidden lg:flex w-full max-w-[1500px] mb-8 justify-end items-center px-2">
                        <label className="flex items-center cursor-pointer group">
                            <div className="relative">
                                <input type="checkbox" className="sr-only" checked={!isSimpleMode} onChange={() => setIsSimpleMode(!isSimpleMode)} />
                                <div className={`block w-12 h-6 rounded-full transition-colors ${!isSimpleMode ? 'bg-blue-500/80 border border-blue-400' : 'bg-slate-800 border border-slate-600'}`}></div>
                                <div className={`absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${!isSimpleMode ? 'transform translate-x-6' : ''}`}></div>
                            </div>
                            <div className={`ml-3 text-[10px] font-bold uppercase tracking-[0.2em] transition-colors ${!isSimpleMode ? 'text-blue-400' : 'text-slate-500 group-hover:text-slate-300'}`}>
                                Show Topological Wiring
                            </div>
                        </label>
                    </div>

                    {/* --- MOBILE & TABLET VIEW (Stacked layout, hidden on lg screens) --- */}
                    <div className="block lg:hidden w-full max-w-3xl mx-auto space-y-10 pb-10">

                    <ZoneModal 
                        zone={selectedZone} 
                        vectorInfo={selectedVector} 
                        domainInfo={selectedDomain} 
                        onClose={() => setSelectedId(null)} 
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
