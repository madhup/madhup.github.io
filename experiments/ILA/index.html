        );

        const App = () => {
            const [selectedZone, setSelectedZone] = useState(null);
            const [hoveredDomain, setHoveredDomain] = useState(null);
            const [hoveredVector, setHoveredVector] = useState(null);

            useEffect(() => {
                const handleEsc = (e) => {
                    if (e.key === 'Escape') setSelectedZone(null);
                };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, []);

            // Helper Functions
            const isNurture = (id) => ['sustain', 'optimize'].includes(id);
            const isLeverage = (id) => ['experience', 'contribute'].includes(id);
            const isIndividual = (id) => ['mind', 'body'].includes(id);
            const isCollective = (id) => ['culture', 'system'].includes(id);

            // Helper to generate gradient classes
            const getCellClasses = (zone) => {
                const domain = DOMAINS[zone.domain.toUpperCase()];
                const vector = VECTORS[zone.vector.toUpperCase()];
                
                const isDomainHovered = hoveredDomain === zone.domain;
                const isVectorHovered = hoveredVector === zone.vector;
                const isInactive = (hoveredDomain && !isDomainHovered) || (hoveredVector && !isVectorHovered);
                
                if (isInactive) {
                    return `relative p-3 md:h-32 rounded-xl border border-slate-800 bg-slate-900 opacity-20 scale-95 grayscale transition-all duration-300 flex flex-col justify-between overflow-hidden`;
                }

                // Dynamic Gradient Construction
                // We use a subtle gradient of the two distinctive colors
                const baseClasses = `
                    relative p-3 md:h-32 rounded-xl border transition-all duration-300 cursor-pointer 
                    flex flex-col justify-between group overflow-hidden hover:-translate-y-1 hover:shadow-2xl
                `;
                
                // Tailwind arbitrary values for gradients
                const gradientClass = `bg-gradient-to-br from-${domain.color}-950/40 to-${vector.color}-950/40 hover:from-${domain.color}-900/60 hover:to-${vector.color}-900/60`;
                const borderClass = `border-${domain.color}-800/50 hover:border-${vector.color}-500/50`;

                return `${baseClasses} ${gradientClass} ${borderClass}`;
            };

            const getVectorHeaderClasses = (vector) => {
                const isHovered = hoveredVector === vector.id;
                // CHANGED: Height from h-24 to h-32 to match Domain headers
                // CHANGED: p-0 to p-2 to match Domain header inner padding
                const baseClasses = `group/col-header relative h-32 text-center p-2 rounded-lg transition-all duration-300 cursor-help border flex flex-col items-center justify-center overflow-hidden`;
                const activeClasses = isHovered ? `bg-${vector.color}-950/30 border-${vector.color}-500/50 shadow-lg scale-105 z-10` : `border-transparent hover:bg-${vector.color}-950/20`;
                return `${baseClasses} ${activeClasses}`;
            };

            const getDomainHeaderClasses = (domain) => {
                const isHovered = hoveredDomain === domain.id;
                const baseClasses = `group/header relative h-32 rounded-lg transition-all duration-300 cursor-help border flex overflow-hidden`;
                const activeClasses = isHovered ? `bg-${domain.color}-950/30 border-${domain.color}-500/50 shadow-lg scale-105 z-10` : `border-transparent hover:bg-${domain.color}-950/20`;
                return `${baseClasses} ${activeClasses}`;
            };

            // Mobile/Tablet List View
            const MobileLayout = () => (
                <div className="space-y-8">
                    {Object.values(DOMAINS).map(domain => (
                        <div key={domain.id} className="space-y-4">
                            <div className={`p-4 rounded-xl border border-${domain.color}-800 bg-${domain.color}-950/30 flex items-center justify-between`}>
                                <div className="flex items-center gap-3">
                                    <domain.icon size={24} className={`text-${domain.color}-400`} />
                                    <div>
                                        <h3 className="text-lg font-bold text-white">{domain.label}</h3>
                                        <div className="flex gap-2 mt-1">
                                            {domain.quadrants.map(q => (
                                                <span key={q} className="text-[10px] uppercase tracking-wider font-bold text-slate-500 px-2 py-0.5 bg-slate-950 rounded border border-slate-800">
                                                    {q}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {['sustain', 'optimize', 'experience', 'contribute'].map(vectorKey => {
                                    const zone = ZONES.find(z => z.domain === domain.id && z.vector === vectorKey);
                                    const vector = VECTORS[vectorKey.toUpperCase()];
                                    return (
                                        <div 
                                            key={zone.id}
                                            onClick={() => setSelectedZone(zone)}
                                            className={`p-4 rounded-xl border bg-gradient-to-br from-${domain.color}-950/20 to-${vector.color}-950/20 cursor-pointer active:scale-95 transition-transform border-${domain.color}-900/50 hover:border-${vector.color}-500/50`}
                                        >
                                            <div className="flex justify-between items-center mb-2">
                                                <span className={`text-[10px] font-bold uppercase tracking-widest text-${vector.color}-400`}>
                                                    {vector.label}
                                                </span>
                                                <Icons.Maximize2 size={12} className="text-slate-500" />
                                            </div>
                                            <h4 className="text-base font-bold text-slate-200 leading-tight">{zone.objective}</h4>
                                            <p className="text-xs text-slate-500 mt-1 line-clamp-2">{zone.shortDesc}</p>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}

                    {/* Mobile Mechanism Section */}
                    <div className="pt-8 border-t border-slate-800">
                        <div className="p-4 rounded-xl border border-slate-700 bg-slate-900/50 flex items-center gap-3 mb-4">
                            <Icons.Settings size={24} className="text-amber-400" />
                            <h3 className="text-lg font-bold text-white">Mechanism</h3>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {Object.entries(MECHANISM_DATA).map(([vectorKey, label]) => {
                                const vector = VECTORS[vectorKey.toUpperCase()];
                                return (
                                    <div key={vectorKey} className="p-4 rounded-xl border border-slate-800 bg-slate-950/30">
                                        <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 block mb-2">{vector.label}</span>
                                        <h4 className="text-base font-bold text-amber-200/90">{label}</h4>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            // Desktop Matrix View
            const DesktopLayout = () => (
                <div className="w-full">
                    {/* Corrected Grid Structure for Headers + Body */}
                    {/* Use grid-cols repeat(5, 1fr) effectively, treating domain column same width as vectors */}
                    <div className="grid grid-cols-[24px_24px_repeat(5,minmax(0,1fr))] gap-4">
                        
                        {/* --- HEADERS SECTION --- */}

                        <div className="col-span-3 row-span-3 relative rounded-xl border border-slate-800/50 bg-slate-950/30 p-4 flex flex-col justify-between overflow-hidden group">
                            <svg className="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
                                <line x1="0" y1="0" x2="100%" y2="100%" stroke="rgba(30, 41, 59, 0.5)" strokeWidth="1" />
                            </svg>
                            <div className="flex justify-end items-start h-1/2">
                                <div className="text-right pl-8">
                                    <div className="flex items-center justify-end gap-2 text-indigo-400 mb-1">
                                        <span className="text-[10px] font-bold uppercase tracking-widest text-right">Vectors of <br/> Operation</span>
                                        <Icons.ArrowRight size={14} />
                                    </div>
                                </div>
                            </div>
                            <div className="flex justify-start items-end h-1/2">
                                <div className="text-left pr-8">
                                    <div className="flex items-center justify-start gap-2 text-indigo-400 mb-1">
                                        <Icons.ArrowDown size={14} />
                                        <span className="text-[10px] font-bold uppercase tracking-widest">Domains <br/> of Reality</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Row 1: Nurture / Leverage (Superheaders) */}
                        <div className={`col-span-2 text-center bg-slate-900/30 border border-slate-800/50 rounded-t-xl py-1 flex items-center justify-center relative transition-all duration-300 ${
                            (hoveredVector && isNurture(hoveredVector)) ? 'bg-amber-900/20 border-amber-500/30 shadow-lg' : ''
                        }`}>
                            <div className="absolute inset-0 bg-gradient-to-b from-amber-900/10 to-transparent rounded-t-xl opacity-50"></div>
                            <span className={`text-[9px] font-mono uppercase tracking-[0.2em] font-bold relative z-10 transition-colors ${
                                (hoveredVector && isNurture(hoveredVector)) ? 'text-amber-100' : 'text-amber-200/70'
                            }`}>Nurture</span>
                        </div>
                        <div className={`col-span-2 text-center bg-slate-900/30 border border-slate-800/50 rounded-t-xl py-1 flex items-center justify-center relative transition-all duration-300 ${
                            (hoveredVector && isLeverage(hoveredVector)) ? 'bg-purple-900/20 border-purple-500/30 shadow-lg' : ''
                        }`}>
                            <div className="absolute inset-0 bg-gradient-to-b from-purple-900/10 to-transparent rounded-t-xl opacity-50"></div>
                            <span className={`text-[9px] font-mono uppercase tracking-[0.2em] font-bold relative z-10 transition-colors ${
                                (hoveredVector && isLeverage(hoveredVector)) ? 'text-purple-100' : 'text-purple-200/70'
                            }`}>Leverage</span>
                        </div>

                        {/* Row 2: Stasis / Kinesis (Superheaders) */}
                        {/* Stasis 1 */}
                        <div className={`col-span-1 text-center bg-slate-950/20 border border-slate-800/30 rounded-xl py-1 flex items-center justify-center transition-all duration-300 ${
                            hoveredVector === 'sustain' ? 'bg-slate-800/50 border-slate-600/50 shadow' : ''
                        }`}>
                            <span className={`text-[8px] font-mono uppercase tracking-widest transition-colors ${hoveredVector === 'sustain' ? 'text-white' : 'text-slate-500'}`}>Stasis</span>
                        </div>
                        {/* Kinesis 1 */}
                        <div className={`col-span-1 text-center bg-slate-950/20 border border-slate-800/30 rounded-xl py-1 flex items-center justify-center transition-all duration-300 ${
                            hoveredVector === 'optimize' ? 'bg-slate-800/50 border-slate-600/50 shadow' : ''
                        }`}>
                            <span className={`text-[8px] font-mono uppercase tracking-widest transition-colors ${hoveredVector === 'optimize' ? 'text-white' : 'text-slate-500'}`}>Kinesis</span>
                        </div>
                        {/* Stasis 2 */}
                        <div className={`col-span-1 text-center bg-slate-950/20 border border-slate-800/30 rounded-xl py-1 flex items-center justify-center transition-all duration-300 ${
                            hoveredVector === 'experience' ? 'bg-slate-800/50 border-slate-600/50 shadow' : ''
                        }`}>
                            <span className={`text-[8px] font-mono uppercase tracking-widest transition-colors ${hoveredVector === 'experience' ? 'text-white' : 'text-slate-500'}`}>Stasis</span>
                        </div>
                        {/* Kinesis 2 */}
                        <div className={`col-span-1 text-center bg-slate-950/20 border border-slate-800/30 rounded-xl py-1 flex items-center justify-center transition-all duration-300 ${
                            hoveredVector === 'contribute' ? 'bg-slate-800/50 border-slate-600/50 shadow' : ''
                        }`}>
                            <span className={`text-[8px] font-mono uppercase tracking-widest transition-colors ${hoveredVector === 'contribute' ? 'text-white' : 'text-slate-500'}`}>Kinesis</span>
                        </div>

                        {/* Row 3: Vector Headers */}
                        {Object.values(VECTORS).map(vector => (
                            <div 
                                key={vector.id}
                                className={getVectorHeaderClasses(vector)}
                                onMouseEnter={() => setHoveredVector(vector.id)}
                                onMouseLeave={() => setHoveredVector(null)}
                            >
                                <div className={`flex flex-col items-center justify-center w-full transition-transform duration-300 ${hoveredVector === vector.id ? '-translate-y-3' : ''}`}>
                                    <div className="flex flex-col items-center gap-2">
                                        <vector.icon size={24} className={`transition-colors duration-300 ${hoveredVector === vector.id ? `text-${vector.color}-400` : 'text-slate-600'}`} />
                                        <div className={`font-bold uppercase tracking-wider text-xs transition-colors duration-300 ${hoveredVector === vector.id ? 'text-white' : 'text-slate-400'}`}>
                                            {vector.label}
                                        </div>
                                    </div>
                                </div>
                                <div className={`absolute bottom-2 left-2 right-2 text-[9px] leading-tight text-slate-400 transition-opacity duration-300 delay-100 ${hoveredVector === vector.id ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                    {vector.desc}
                                </div>
                            </div>
                        ))}

                        {/* --- BODY SECTION --- */}
                        
                        {DOMAIN_GROUPS.map((group, groupIndex) => (
                            <React.Fragment key={group.label}>
                                {/* Group Sidebar (Individual / Collective) - Spans 2 rows */}
                                <div className={`row-span-2 w-[24px] bg-slate-900/30 border border-slate-800/50 rounded-l-xl flex flex-col items-center justify-center relative overflow-visible shrink-0 after:absolute after:right-0 after:top-1/2 after:-translate-y-1/2 after:h-px after:w-2 after:bg-slate-700/50 h-full transition-all duration-300 ${
                                    (hoveredDomain && (groupIndex === 0 ? isIndividual(hoveredDomain) : isCollective(hoveredDomain))) 
                                        ? (groupIndex === 0 ? 'bg-indigo-900/20 border-indigo-500/30 shadow-lg' : 'bg-rose-900/20 border-rose-500/30 shadow-lg')
                                        : ''
                                }`}>
                                    <div className={`absolute inset-0 bg-gradient-to-r opacity-50 ${groupIndex === 0 ? 'from-indigo-900/10' : 'from-rose-900/10'} to-transparent`}></div>
                                    <span className={`text-[9px] font-mono uppercase tracking-[0.2em] font-bold -rotate-90 whitespace-nowrap relative z-10 transition-colors ${
                                        (hoveredDomain && (groupIndex === 0 ? isIndividual(hoveredDomain) : isCollective(hoveredDomain)))
                                            ? 'text-white'
                                            : (groupIndex === 0 ? 'text-indigo-200/70' : 'text-rose-200/70')
                                    }`}>
                                        {group.label}
                                    </span>
                                </div>

                                {group.domains.map(domainId => {
                                    const domain = DOMAINS[domainId.toUpperCase()];
                                    return (
                                        <React.Fragment key={domainId}>
                                            {/* Hierarchy 2 (Interior / Exterior) - Distinct Header */}
                                            <div className={`bg-slate-950/20 border border-slate-800/30 rounded-xl flex flex-col items-center justify-center relative overflow-hidden shrink-0 h-32 transition-all duration-300 ${
                                                hoveredDomain === domain.id ? 'bg-slate-800/50 border-slate-600/50 shadow' : ''
                                            }`}>
                                                <span className={`text-[8px] font-mono uppercase tracking-widest -rotate-90 whitespace-nowrap transition-colors ${hoveredDomain === domain.id ? 'text-white' : 'text-slate-500'}`}>
                                                    {domain.hierarchy2}
                                                </span>
                                            </div>

                                            {/* Row Header (Domain) */}
                                            <div 
                                                className={getDomainHeaderClasses(domain)}
                                                onMouseEnter={() => setHoveredDomain(domain.id)}
                                                onMouseLeave={() => setHoveredDomain(null)}
                                            >
                                                <div className={`flex-1 p-2 flex flex-col items-center justify-center h-full w-full transition-transform duration-300 ${hoveredDomain === domain.id ? '-translate-y-3' : ''}`}>
                                                    {/* CHANGED: Icon size from 20 to 24 to match Vector Headers */}
                                                    <domain.icon size={24} className={`mb-2 transition-colors ${hoveredDomain === domain.id ? `text-${domain.color}-400` : 'text-slate-600'}`} />
                                                    <div className={`font-bold uppercase tracking-wider text-xs transition-colors whitespace-normal text-center ${hoveredDomain === domain.id ? 'text-white' : 'text-slate-400'}`}>{domain.label}</div>
                                                </div>
                                                <div className={`absolute bottom-2 left-2 right-2 text-[9px] leading-tight text-slate-400 transition-opacity duration-300 delay-100 text-center ${hoveredDomain === domain.id ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                                                    {domain.desc}
                                                </div>
                                            </div>

                                            {/* Zones */}
                                            {['sustain', 'optimize', 'experience', 'contribute'].map(vectorKey => {
                                                const zone = ZONES.find(z => z.domain === domain.id && z.vector === vectorKey);
                                                return (
                                                    <div 
                                                        key={zone.id}
                                                        className={getCellClasses(zone)}
                                                        onClick={() => setSelectedZone(zone)}
                                                        onMouseEnter={() => {
                                                            setHoveredDomain(domain.id);
                                                            setHoveredVector(vectorKey);
                                                        }}
                                                        onMouseLeave={() => {
                                                            setHoveredDomain(null);
                                                            setHoveredVector(null);
                                                        }}
                                                    >
                                                        <div className="flex justify-between items-start mb-4 md:mb-0">
                                                            <div className="flex gap-2">
                                                                <span className={`text-[8px] font-extrabold uppercase tracking-widest px-1.5 py-0.5 rounded bg-${domain.color}-950/40 text-${domain.color}-300 backdrop-blur-sm border border-white/5`}>
                                                                    {DOMAINS[domain.id.toUpperCase()].label}
                                                                </span>
                                                                <span className={`text-[8px] font-extrabold uppercase tracking-widest px-1.5 py-0.5 rounded bg-${VECTORS[vectorKey.toUpperCase()].color}-950/40 text-${VECTORS[vectorKey.toUpperCase()].color}-300 backdrop-blur-sm border border-white/5`}>
                                                                    {VECTORS[vectorKey.toUpperCase()].label}
                                                                </span>
                                                            </div>
                                                            <Icons.Maximize2 size={12} className="opacity-0 group-hover:opacity-100 transition-all duration-300 text-white transform group-hover:scale-110" />
                                                        </div>
                                                        <div className="relative z-10 mt-2">
                                                            <h4 className={`font-extrabold text-base md:text-lg leading-tight mb-1 transition-colors ${hoveredDomain === domain.id ? 'text-white' : 'text-slate-200'}`}>
                                                                {zone.objective}
                                                            </h4>
                                                            <p className="hidden md:block text-xs md:text-sm font-medium text-slate-400 leading-relaxed group-hover:text-slate-300 transition-colors">
                                                                {zone.shortDesc}
                                                            </p>
                                                        </div>
                                                        <div className="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-500 bg-gradient-to-tr from-transparent via-white to-transparent transform translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000 pointer-events-none" />
                                                    </div>
                                                );
                                            })}
                                        </React.Fragment>
                                    );
                                })}
                            </React.Fragment>
                        ))}

                        {/* --- MECHANISM SECTION --- */}
                        <div className="col-span-full h-px bg-gradient-to-r from-transparent via-slate-700 to-transparent my-2" />

                        <div className="col-span-3 group/header relative h-32 rounded-lg border border-gray-800 bg-slate-900/40 flex flex-col items-center justify-center overflow-hidden">
                            <div className="flex flex-col items-center gap-2">
                                <Icons.Settings size={20} className="text-gray-400" />
                                <span className="font-bold uppercase tracking-wider text-xs text-gray-300">Mechanism</span>
                            </div>
                        </div>

                        {['sustain', 'optimize', 'experience', 'contribute'].map(vectorKey => {
                            const vector = VECTORS[vectorKey.toUpperCase()];
                            return (
                                <div key={`mech-${vectorKey}`} className={`relative p-4 h-32 rounded-xl border border-slate-800 bg-gradient-to-br from-slate-950/50 to-${vector.color}-950/30 flex flex-col justify-center items-center text-center group hover:border-${vector.color}-500/50 transition-all`}>
                                    <span className={`text-[10px] font-extrabold uppercase tracking-widest text-${vector.color}-400 mb-2`}>{vector.label}</span>
                                    <h4 className="font-extrabold text-lg text-slate-200">{MECHANISM_DATA[vectorKey]}</h4>
                                </div>
                            )
                        })}

                    </div>
                </div>
            );

            return (
                <div className="min-h-screen font-sans">
                    <Header />

                    <main className="w-full px-6 py-8 animate-fade-in">
                        
                        {/* Responsive Views */}
                        <div className="block md:hidden">
                            <MobileLayout />
                        </div>
                        
                        <div className="hidden md:block pb-10">
                            <DesktopLayout />
                        </div>

                    </main>

                    <Footer />

                    {/* Modal Layer */}
                    {selectedZone && (
                        <DetailModal zone={selectedZone} onClose={() => setSelectedZone(null)} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
